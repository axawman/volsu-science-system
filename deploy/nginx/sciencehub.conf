limit_req_zone $binary_remote_addr zone=sciencehub_general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=sciencehub_login:10m rate=5r/m;

upstream sciencehub_app {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name волгу-наука.рф xn----8sbaff8bdsf6cd.xn--p1ai;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name волгу-наука.рф xn----8sbaff8bdsf6cd.xn--p1ai;

    ssl_certificate /etc/letsencrypt/live/волгу-наука.рф/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/волгу-наука.рф/privkey.pem;

    client_max_body_size 25m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location /static/ {
        alias /home/axawys/volsu-science-system/src/staticfiles/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /home/axawys/volsu-science-system/src/media/;
        expires 7d;
    }

    location ~ ^/(login/|accounts/login/|accounts/register/) {
        limit_req zone=sciencehub_login burst=10 nodelay;
        proxy_pass http://sciencehub_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;
    }

    location / {
        limit_req zone=sciencehub_general burst=30 nodelay;
        proxy_pass http://sciencehub_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;
    }
}
