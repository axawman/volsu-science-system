name: Django CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]

jobs:
  test-and-lint:
    name: Run Linter and Tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8
    - run: |
        flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 src/ --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics
    - env:
        SECRET_KEY: "test-secret-key-for-github"
        DEBUG: "1"
      run: |
        cd src
        python manage.py test

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: test-and-lint # Деплоим ТОЛЬКО если тесты прошли успешно
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
    - name: Deploy to Server via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        script: |
          # ВАЖНО: Укажи здесь путь к папке, в которую ты клонировал проект на Шаге 2
          cd /home/axawys/volsu-science-system
          
          # Скачиваем свежий код
          git pull origin main
          
          # Пересобираем и перезапускаем контейнеры без остановки сайта (-d)
          docker compose up -d --build
