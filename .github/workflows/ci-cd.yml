name: Django CI/CD Pipeline

# Автозапуск отключён: сервер для деплоя больше не существует.
# Запуск возможен только вручную через вкладку Actions.
on:
  workflow_dispatch:

jobs:
  test-and-lint:
    name: Run Linter and Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: science_registry
          POSTGRES_USER: science_user
          POSTGRES_PASSWORD: science_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U science_user -d science_registry"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8
    - run: |
        flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 src/ --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics
    - env:
        SECRET_KEY: "test-secret-key-for-github"
        DEBUG: "1"
        POSTGRES_DB: science_registry
        POSTGRES_USER: science_user
        POSTGRES_PASSWORD: science_password
        POSTGRES_HOST: 127.0.0.1
        POSTGRES_PORT: "5432"
      run: |
        cd src
        python manage.py test

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: test-and-lint # Деплоим ТОЛЬКО если тесты прошли успешно
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
    - name: Deploy to Server via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        command_timeout: 45m
        script: |
          set -Eeuxo pipefail

          # ВАЖНО: Укажи здесь путь к папке, в которую ты клонировал проект на Шаге 2
          cd /home/axawys/volsu-science-system
          
          # Разрешаем Git работать с этой папкой
          git config --global --add safe.directory /home/axawys/volsu-science-system

          DEPLOY_BRANCH="${{ github.ref_name }}"

          # Скачиваем свежий код
          git fetch origin "$DEPLOY_BRANCH"
          git checkout -f -B "$DEPLOY_BRANCH" "origin/$DEPLOY_BRANCH"
          git reset --hard "origin/$DEPLOY_BRANCH"
          echo "Deploying commit: $(git rev-parse --short HEAD)"
          test -f src/templates/works/_comment_thread.html
          grep -q "reply-toggle" src/templates/works/_comment_thread.html
          
          # Пересобираем и перезапускаем контейнеры без остановки сайта (-d)
          docker compose up -d --build --force-recreate
          docker compose exec -T web sh -c 'cd /app/src && grep -q "reply-toggle" templates/works/_comment_thread.html && python manage.py showmigrations discussions'
          docker compose ps
