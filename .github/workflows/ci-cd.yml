name: Django CI/CD Pipeline

# Запускать скрипт при каждом пуше в ветку main (или master)
on:
  push:
    branches: [ "main", "master" ]

jobs:
  test-and-lint:
    name: Run Linter and Tests
    runs-on: ubuntu-latest

    steps:
    - name: Скачиваем код из репозитория
      uses: actions/checkout@v4

    - name: Устанавливаем Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Устанавливаем зависимости
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8

    - name: Проверяем код линтером (Flake8)
      run: |
        # Остановит проверку, если есть грубые синтаксические ошибки
        flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # Просто покажет предупреждения по стилю (лимит 120 символов)
        flake8 src/ --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

    - name: Запускаем тесты Django
      env:
        SECRET_KEY: "test-secret-key-for-github"
        DEBUG: "1"
      run: |
        cd src
        python manage.py test
